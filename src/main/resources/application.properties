spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL 
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/webserver?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto
server.port=${PORT:${SERVER_PORT:8080}}\
