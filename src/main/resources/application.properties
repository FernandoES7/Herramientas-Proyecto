# Cargar variables de entorno
spring.config.import=optional:file:.env[.properties]

# Conexión MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/webserver?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${DB_USER:root}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto Spring Boot
server.port=${PORT:${SERVER_PORT:8080}}