name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Test
        run: ./mvnw test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest
          # Tag con los 7 primeros caracteres del SHA (el mismo que usa deploy)
          SHA_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${GITHUB_SHA::7}

          docker build -t $IMAGE_TAG -t $SHA_TAG .

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE_TAG
            docker push $SHA_TAG
          fi

  deploy:
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: read
    steps:
      - name: Compute image name
        id: img
        run: echo "name=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Run container on Docker Desktop
        run: |
          docker pull --platform linux/amd64 ${{ steps.img.outputs.name }}
          docker rm -f app || true
          docker run -d --name app --platform linux/amd64 -p 8080:8080 ${{ steps.img.outputs.name }}
          docker image prune -f
