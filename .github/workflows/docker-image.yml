name: Build, Test and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B compile

  test:
    runs-on: ubuntu-latest
    needs: build
    environment: .env

    env:
      DB_URL: ${{ secrets.DB_URL }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test

  package:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Give execute permission to mvnw
        run: chmod +x mvnw

      - name: Package jar
        run: ./mvnw -B package -DskipTests

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          IMAGE_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:latest
          # Tag con los 7 primeros caracteres del SHA (el mismo que usa deploy)
          SHA_TAG=${{ env.REGISTRY }}/$IMAGE_NAME_LOWER:${GITHUB_SHA::7}

          docker build -t $IMAGE_TAG -t $SHA_TAG .

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push $IMAGE_TAG
            docker push $SHA_TAG
          fi

  deploy:
    runs-on: self-hosted
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image name
        id: img
        run: |
          $registry = "${{ env.REGISTRY }}"
          $imageName = "${{ env.IMAGE_NAME }}".ToLower()
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)

          $fullImage = "${registry}/${imageName}:${shortSha}"

          "name=$fullImage" >> $env:GITHUB_OUTPUT

      - name: Apply manifests
        run: |
          $image = "${{ steps.img.outputs.name }}"

          (Get-Content k8s/deployment.yaml -Raw).Replace(
            "IMAGE_PLACEHOLDER", $image
          ) | kubectl --context docker-desktop apply -f -

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          kubectl --context docker-desktop apply -f k8s/service.yaml

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Wait for rollout
        run: |
          kubectl --context docker-desktop rollout status deployment/demo --timeout=180s

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }